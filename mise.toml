[tools]
java = "25"
bun = "1.3"
docker-cli = "29.3.1"
docker-compose = "5.1.4"
colima = { version = "0.10.1", lazy = true }

[settings]
task.run_auto_install = true

[tasks.validate]
description = "Run the service fast verification gate"
run = "company-check-service/gradlew fastCheck"

[tasks.service-full]
description = "Run the complete service verification gate"
run = "company-check-service/gradlew qualityGate"

[tasks.performance]
description = "Run the service-owned Locust workload"
run = "company-check-service/performance/run.sh"

[tasks.provider]
description = "Run provider formatting, type, lint and test checks"
run = "cd company-check-provider && bun run quality"

[tasks.start]
description = "Start the single-node Compose stack"
run = """
if ! docker info >/dev/null 2>&1 && command -v colima >/dev/null 2>&1; then
  colima start --cpu 4 --memory 4
fi
docker-cli-plugin-docker-compose -f compose.yaml -f compose.single.yaml up -d --scale backend=1
"""

[tasks.start-distributed]
description = "Start the distributed Compose stack with shared Redis"
run = """
if ! docker info >/dev/null 2>&1 && command -v colima >/dev/null 2>&1; then
  colima start --cpu 4 --memory 4
fi
docker-cli-plugin-docker-compose -f compose.yaml -f compose.distributed.yaml up -d --scale backend=2
"""

[tasks.stop]
description = "Stop the Compose stack"
run = "docker-cli-plugin-docker-compose -f compose.yaml -f compose.distributed.yaml down --remove-orphans"

[tasks.logs]
description = "Follow single-node service logs"
run = "docker-cli-plugin-docker-compose -f compose.yaml -f compose.single.yaml logs -f backend free-provider premium-provider"
