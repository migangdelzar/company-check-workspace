[tools]
docker = "27.5.1"
docker-compose = "2.35.1"
colima = "0.8.1"

[env]
COMPANY_CHECK_SERVICE_COMMIT = "c1525383c3e9a975d893e30fc3192eac21587633"
COMPANY_CHECK_PROVIDER_COMMIT = "f23d82b3ba590ded39dc7b79d8d38030dde49774"

[tasks.validate]
description = "Run the service fast verification gate"
run = "company-check-service/gradlew fastCheck"

[tasks.service-full]
description = "Run the complete service verification gate"
run = "company-check-service/gradlew qualityGate"

[tasks.provider-quality]
description = "Run provider formatting, type, lint and test checks"
run = "cd company-check-provider && bun run quality"

[tasks.compose-up]
description = "Start the core Compose stack"
run = "docker compose up -d"

[tasks.compose-down]
description = "Stop the Compose stack"
run = "docker compose down"
