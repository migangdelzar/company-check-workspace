name: Security validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      paketo-builder-image:
        description: Immutable Paketo builder image reference for image scanning
        required: true
        type: string
      paketo-run-image:
        description: Immutable Paketo run image reference for image scanning
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: workspace-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            build-mode: manual
            build: ./company-check-service/gradlew -p company-check-service classes --no-parallel --max-workers=1
          - language: javascript-typescript
            build-mode: none
            build: cd company-check-provider && bun install --frozen-lockfile && bun run build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: matrix.language == 'java'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.language == 'javascript-typescript'
        with:
          bun-version: '1.3.14'
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build analyzed source
        run: ${{ matrix.build }}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    # Enable after the repository dependency graph is enabled.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  filesystem:
    name: Filesystem vulnerability and misconfiguration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Report source, dependency, secret, and configuration findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem.sarif
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'
      - name: Fail on high and critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload filesystem findings to code scanning
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem
      - name: Upload filesystem report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-filesystem-${{ github.run_id }}
          path: trivy-filesystem.sarif
          if-no-files-found: warn

  dependency-integrity:
    name: Dependency lock and verification integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            25
            24
      - name: Configure Gradle Java toolchains
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_25_X64},${JAVA_HOME_24_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Verify Gradle dependency locks and signatures
        working-directory: company-check-service
        run: ./gradlew qualityGate --dependency-verification=strict --no-parallel --max-workers=1
      - name: Verify Bun lockfile and production compilation
        working-directory: company-check-provider
        run: |
          bun install --frozen-lockfile
          bun run build

  container:
    name: Build and scan JVM image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.PAKETO_BUILDER_IMAGE != '' && vars.PAKETO_RUN_IMAGE != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      PAKETO_BUILDER_IMAGE: ${{ inputs.paketo-builder-image || vars.PAKETO_BUILDER_IMAGE }}
      PAKETO_RUN_IMAGE: ${{ inputs.paketo-run-image || vars.PAKETO_RUN_IMAGE }}
      SECURITY_IMAGE: company-check-security:${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Require immutable Paketo inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAKETO_BUILDER_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-fA-F]{64}$ ]]
          [[ "$PAKETO_RUN_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-fA-F]{64}$ ]]
      - name: Build JVM image without publishing
        working-directory: company-check-service
        run: >-
          ./gradlew image
          -PimageVariant=jvm
          -PpaketoBuilderImage="$PAKETO_BUILDER_IMAGE"
          -PpaketoRunImage="$PAKETO_RUN_IMAGE"
          -PimagePlatform=linux/amd64
          -PimageName="$SECURITY_IMAGE"
          -PpublishImage=false
          --dependency-verification=strict --no-parallel --max-workers=1
      - name: Report JVM image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SECURITY_IMAGE }}
          format: sarif
          output: trivy-image.sarif
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'
      - name: Fail on high and critical JVM image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SECURITY_IMAGE }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload image findings to code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Generate SPDX image SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.SECURITY_IMAGE }}
          format: spdx-json
          output-file: security-image.spdx.json
          artifact-name: security-image-${{ github.run_id }}.spdx.json
          upload-release-assets: false
      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-image-${{ github.run_id }}
          path: trivy-image.sarif
          if-no-files-found: warn
