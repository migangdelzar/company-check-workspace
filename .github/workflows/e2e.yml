name: Workspace E2E

on:
  workflow_call:
    inputs:
      service-image:
        required: true
        type: string
      provider-image:
        required: true
        type: string
      postgres-image:
        required: true
        type: string
      redis-image:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out workspace and runtime fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Run Compose API end-to-end checks
        uses: ./.github/actions/compose-e2e
        with:
          service-image: ${{ inputs.service-image }}
          provider-image: ${{ inputs.provider-image }}
          postgres-image: ${{ inputs.postgres-image }}
          redis-image: ${{ inputs.redis-image }}
