name: Workspace E2E

on:
  workflow_call:
    inputs:
      service-image:
        required: true
        type: string
      provider-image:
        required: true
        type: string
      postgres-image:
        required: true
        type: string
      redis-image:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out workspace and runtime fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Run Compose API end-to-end checks
        uses: ./.github/actions/compose-e2e
        with:
          service-image: ${{ inputs.service-image }}
          provider-image: ${{ inputs.provider-image }}
          postgres-image: ${{ inputs.postgres-image }}
          redis-image: ${{ inputs.redis-image }}
      - name: Summarize Compose E2E run
        shell: bash
        run: |
          {
            echo "## Compose E2E run"
            echo
            echo "| Component | Immutable image |"
            echo "|-----------|-----------------|"
            echo "| service | \`${{ inputs.service-image }}\` |"
            echo "| provider | \`${{ inputs.provider-image }}\` |"
            echo "| postgres | \`${{ inputs.postgres-image }}\` |"
            echo "| redis | \`${{ inputs.redis-image }}\` |"
            echo
            echo "Validated with the verification API:"
            echo "- Compose stack starts and the backend actuator health is reachable."
            echo "- A \`verify-start\` request completes and returns a matching verification id."
            echo "- A \`verify-result\` lookup returns the completed company details for the requested CIN."
          } >>"$GITHUB_STEP_SUMMARY"
