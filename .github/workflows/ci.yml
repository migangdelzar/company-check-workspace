name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Check workspace contract and topology gates
        working-directory: company-check-service
        run: ./gradlew fastCheck

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      service: ${{ steps.paths.outputs.service }}
      provider: ${{ steps.paths.outputs.provider }}
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          matches() { printf '%s\n' "$changed" | grep -Eq "$1"; }
          printf 'service=%s\n' "$(matches '^(company-check-service/|\.github/workflows/component-quality\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'provider=%s\n' "$(matches '^(company-check-provider/|\.github/workflows/component-quality\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'e2e=%s\n' "$(matches '^(compose\.yaml|\.env\.example|\.github/(actions/compose-e2e|workflows/(e2e|ci)\.yml))' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  components:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.provider == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: [service, provider]
    uses: ./.github/workflows/component-quality.yml
    with:
      component: ${{ matrix.component }}

  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      vars.COMPANY_CHECK_SERVICE_IMAGE != '' &&
      vars.COMPANY_CHECK_PROVIDER_IMAGE != '' &&
      vars.POSTGRES_IMAGE != '' &&
      vars.REDIS_IMAGE != ''
    uses: ./.github/workflows/e2e.yml
    with:
      service-image: ${{ vars.COMPANY_CHECK_SERVICE_IMAGE }}
      provider-image: ${{ vars.COMPANY_CHECK_PROVIDER_IMAGE }}
      postgres-image: ${{ vars.POSTGRES_IMAGE }}
      redis-image: ${{ vars.REDIS_IMAGE }}
