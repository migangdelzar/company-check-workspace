name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run-validation:
        description: Run the complete JVM/native validation workflow
        required: true
        default: false
        type: boolean
      image-variant:
        description: Image variant to validate when run-validation is enabled
        required: true
        default: jvm
        type: choice
        options:
          - jvm
          - native
      postgres-image:
        description: Immutable PostgreSQL image reference for E2E and Locust
        required: false
        type: string
      redis-image:
        description: Immutable Redis image reference for E2E and Locust
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out workspace and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Validate workspace contract and submodule topology
        working-directory: company-check-service
        run: ./gradlew fastCheck

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      service: ${{ steps.paths.outputs.service }}
      provider: ${{ steps.paths.outputs.provider }}
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - name: Check out workspace history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Detect changed workspace areas
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          matches() { printf '%s\n' "$changed" | grep -Eq "$1"; }
          printf 'service=%s\n' "$(matches '^(company-check-service/|\.github/workflows/component-quality\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'provider=%s\n' "$(matches '^(company-check-provider/|\.github/workflows/component-quality\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'e2e=%s\n' "$(matches '^(compose\.yaml|\.env\.example|\.github/(actions/compose-e2e|workflows/(e2e|ci)\.yml))' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  components:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.provider == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: [service, provider]
    uses: ./.github/workflows/component-quality.yml
    with:
      component: ${{ matrix.component }}

  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      vars.COMPANY_CHECK_SERVICE_IMAGE != '' &&
      vars.COMPANY_CHECK_PROVIDER_IMAGE != '' &&
      vars.POSTGRES_IMAGE != '' &&
      vars.REDIS_IMAGE != ''
    uses: ./.github/workflows/e2e.yml
    with:
      service-image: ${{ vars.COMPANY_CHECK_SERVICE_IMAGE }}
      provider-image: ${{ vars.COMPANY_CHECK_PROVIDER_IMAGE }}
      postgres-image: ${{ vars.POSTGRES_IMAGE }}
      redis-image: ${{ vars.REDIS_IMAGE }}

  validation:
    if: github.event_name == 'workflow_dispatch' && inputs.run-validation == true
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validation.yml
    with:
      image-variant: ${{ inputs.image-variant }}
      postgres-image: ${{ inputs.postgres-image }}
      redis-image: ${{ inputs.redis-image }}
