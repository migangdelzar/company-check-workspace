name: Experimental native image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  native:
    runs-on: ubuntu-24.04
    environment: experimental-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish experimental native amd64 image
        uses: docker/build-push-action@v6
        with:
          context: company-check-service
          file: company-check-service/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/company-check-service:native-${{ github.sha }}-amd64
          provenance: false
