name: Experimental native image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run complete service verification gate
        working-directory: company-check-service
        run: ./gradlew qualityGate --no-parallel --max-workers=1

  native:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: experimental-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require immutable Paketo inputs
        shell: bash
        env:
          PAKETO_BUILDER_IMAGE: ${{ vars.PAKETO_BUILDER_IMAGE }}
          PAKETO_RUN_IMAGE: ${{ vars.PAKETO_RUN_IMAGE }}
        run: |
          set -euo pipefail
          [[ "$PAKETO_BUILDER_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-fA-F]{64}$ ]]
          [[ "$PAKETO_RUN_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-fA-F]{64}$ ]]
      - name: Build and publish experimental Paketo native image through Gradle
        working-directory: company-check-service
        env:
          PAKETO_BUILDER_IMAGE: ${{ vars.PAKETO_BUILDER_IMAGE }}
          PAKETO_RUN_IMAGE: ${{ vars.PAKETO_RUN_IMAGE }}
        run: >-
          ./gradlew image
          -PimageVariant=native
          -PnativeOptimization=b
          -PpaketoBuilderImage="$PAKETO_BUILDER_IMAGE"
          -PpaketoRunImage="$PAKETO_RUN_IMAGE"
          -PpublishImage=true
          -PimagePlatform=linux/amd64
          -PimageName=ghcr.io/${{ github.repository_owner }}/company-check-service:native-${{ github.sha }}-amd64
