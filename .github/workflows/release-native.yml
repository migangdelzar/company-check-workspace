name: Experimental native image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            25
            24
      - name: Configure Gradle Java toolchains
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_25_X64},${JAVA_HOME_24_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run complete service verification gate
        working-directory: company-check-service
        run: ./gradlew qualityGate --no-parallel --max-workers=1

  native:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: experimental-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish experimental Paketo native image through Gradle
        working-directory: company-check-service
        run: >-
          ./gradlew bootBuildImage
          -PimageVariant=native
          -PpublishImage=true
          -PimagePlatform=linux/amd64
          -PimageName=ghcr.io/${{ github.repository_owner }}/company-check-service:native-${{ github.sha }}-amd64
