name: Promote release images

on:
  workflow_dispatch:
    inputs:
      service_source:
        description: Digest-pinned source image
        required: true
        type: string
      provider_source:
        description: Digest-pinned source image
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote service without rebuilding
        run: scripts/promote-image.sh "${{ inputs.service_source }}" "ghcr.io/${{ github.repository_owner }}/company-check-service:stable"
      - name: Promote provider without rebuilding
        run: scripts/promote-image.sh "${{ inputs.provider_source }}" "ghcr.io/${{ github.repository_owner }}/company-check-provider:stable"
