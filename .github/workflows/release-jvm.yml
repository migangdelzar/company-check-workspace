name: Release JVM images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run complete service verification gate
        working-directory: company-check-service
        run: ./gradlew qualityGate --no-parallel --max-workers=1

  release:
    needs: verify
    name: JVM ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Paketo JVM image through Gradle
        working-directory: company-check-service
        env:
          PAKETO_BUILDER_IMAGE: ${{ vars.PAKETO_BUILDER_IMAGE }}
          PAKETO_RUN_IMAGE: ${{ vars.PAKETO_RUN_IMAGE }}
        run: >-
          ./gradlew image
          -PimageVariant=jvm
          -PpaketoBuilderImage="$PAKETO_BUILDER_IMAGE"
          -PpaketoRunImage="$PAKETO_RUN_IMAGE"
          -PpublishImage=true
          -PimagePlatform=linux/${{ matrix.arch }}
          -PimageName=ghcr.io/${{ github.repository_owner }}/company-check-service:jvm-${{ github.sha }}-${{ matrix.arch }}
