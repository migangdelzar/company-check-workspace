name: Build validation images

on:
  workflow_call:
    inputs:
      image-variant:
        required: true
        type: string
    outputs:
      service-image:
        description: Immutable GHCR service image reference
        value: ${{ jobs.build.outputs.service-image }}
      provider-image:
        description: Immutable GHCR provider image reference
        value: ${{ jobs.build.outputs.provider-image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      service-image: ${{ steps.refs.outputs.service-image }}
      provider-image: ${{ steps.refs.outputs.provider-image }}
    steps:
      - name: Checkout workspace with submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java 25 and Gradle cache
        uses: ./.github/actions/setup-java
        with:
          java-versions: '25'
      - name: Set up Bun and dependency cache
        uses: ./.github/actions/setup-bun
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable validation image references
        id: refs
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          VARIANT: ${{ inputs.image-variant }}
        run: |
          set -euo pipefail
          [[ "$VARIANT" == "jvm" || "$VARIANT" == "native" ]]
          printf 'service_ref=ghcr.io/%s/company-check-service:validation-%s-%s\n' "$OWNER" "$SHA" "$VARIANT" >>"$GITHUB_OUTPUT"
          printf 'provider_ref=ghcr.io/%s/company-check-provider:validation-%s-%s\n' "$OWNER" "$SHA" "$VARIANT" >>"$GITHUB_OUTPUT"

      - name: Build or reuse provider image
        id: provider
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$PROVIDER_REF" >/dev/null 2>&1; then
            echo "provider-digest=$(docker buildx imagetools inspect "$PROVIDER_REF" --format '{{json .Manifest.Digest}}')" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "provider-tag=$PROVIDER_REF" >>"$GITHUB_OUTPUT"
        env:
          PROVIDER_REF: ${{ steps.refs.outputs.provider_ref }}
      - name: Build and push provider image (cached)
        if: steps.provider.outputs.provider-tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: company-check-provider
          file: company-check-provider/Dockerfile
          push: true
          tags: ${{ steps.provider.outputs.provider-tag }}
          cache-from: type=gha,scope=provider-${{ inputs.image-variant }}
          cache-to: type=gha,mode=max,scope=provider-${{ inputs.image-variant }}

      - name: Build or reuse service image
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$SERVICE_REF" >/dev/null 2>&1; then
            exit 0
          fi
          ./company-check-service/gradlew -p company-check-service bootBuildImage \
            -PimageVariant="$VARIANT" \
            -PimagePlatform=linux/amd64 \
            -PimageName="$SERVICE_REF" \
            -PpublishImage=true \
            --dependency-verification=strict --no-parallel --max-workers=1
        env:
          SERVICE_REF: ${{ steps.refs.outputs.service_ref }}
          VARIANT: ${{ inputs.image-variant }}

      - name: Emit image digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          service_digest="$(docker buildx imagetools inspect "$SERVICE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          provider_digest="${PROVIDER_DIGEST:-$(docker buildx imagetools inspect "$PROVIDER_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')}"
          [[ "$service_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          [[ "$provider_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          printf 'service-image=%s@%s\n' "$SERVICE_REF" "$service_digest" >>"$GITHUB_OUTPUT"
          printf 'provider-image=%s@%s\n' "$PROVIDER_REF" "$provider_digest" >>"$GITHUB_OUTPUT"
        env:
          SERVICE_REF: ${{ steps.refs.outputs.service_ref }}
          PROVIDER_REF: ${{ steps.refs.outputs.provider_ref }}
          PROVIDER_DIGEST: ${{ steps.provider.outputs.provider-digest }}