name: Complete validation

on:
  workflow_dispatch:
    inputs:
      image-variant:
        description: Image variant to validate
        required: true
        default: jvm
        type: choice
        options:
          - jvm
          - native
  workflow_call:
    inputs:
      image-variant:
        required: false
        default: jvm
        type: string
      postgres-image:
        required: false
        default: ''
        type: string
      redis-image:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: workspace-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: Provider quality and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out provider source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked provider dependencies
        working-directory: company-check-provider
        run: bun install --frozen-lockfile
      - name: Check provider formatting
        working-directory: company-check-provider
        run: bun run format:check
      - name: Run provider type checks
        working-directory: company-check-provider
        run: bun run typecheck
      - name: Run provider lint checks
        working-directory: company-check-provider
        run: bun run lint
      - name: Run provider unit tests
        working-directory: company-check-provider
        run: bun run test
      - name: Run provider contract tests
        working-directory: company-check-provider
        run: bun run test:contract
      - name: Compile provider production bundle
        working-directory: company-check-provider
        run: bun run build

  service:
    name: Service JVM quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out service source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java toolchains
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            25
            24
      - name: Configure Gradle Java toolchains
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_25_X64},${JAVA_HOME_24_X64}" >> "$GITHUB_ENV"
      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run unit tests, architecture checks, static analysis, and coverage
        working-directory: company-check-service
        run: ./gradlew unitCheck --dependency-verification=strict --no-parallel --max-workers=1
      - name: Run integration tests with PostgreSQL and Redis
        working-directory: company-check-service
        run: ./gradlew integrationCheck --dependency-verification=strict --no-parallel --max-workers=1
      - name: Run API contract tests
        working-directory: company-check-service
        run: ./gradlew contractTest --dependency-verification=strict --no-parallel --max-workers=1
      - name: Validate OpenAPI contracts
        working-directory: company-check-service
        run: ./gradlew openApiValidate --dependency-verification=strict --no-parallel --max-workers=1
      - name: Run service end-to-end tests
        working-directory: company-check-service
        run: ./gradlew e2eCheck --dependency-verification=strict --no-parallel --max-workers=1
      - name: Validate Gradle build logic
        working-directory: company-check-service
        run: ./gradlew buildLogicCheck --dependency-verification=strict --no-parallel --max-workers=1

  images:
    name: Build or reuse immutable ${{ inputs.image-variant }} validation images
    uses: ./.github/workflows/build-images.yml
    with:
      image-variant: ${{ inputs.image-variant }}

  e2e:
    name: Run Compose E2E and Locust against published images
    needs: [provider, service, images]
    if: inputs.postgres-image != '' && inputs.redis-image != ''
    uses: ./.github/workflows/e2e.yml
    with:
      service-image: ${{ needs.images.outputs.service-image }}
      provider-image: ${{ needs.images.outputs.provider-image }}
      postgres-image: ${{ inputs.postgres-image }}
      redis-image: ${{ inputs.redis-image }}
