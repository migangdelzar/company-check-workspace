name: Complete validation

on:
  workflow_dispatch:
    inputs:
      paketo-builder-image:
        description: Immutable Paketo builder image reference
        required: true
        type: string
      paketo-run-image:
        description: Immutable Paketo run image reference
        required: true
        type: string
  workflow_call:
    inputs:
      paketo-builder-image:
        required: true
        type: string
      paketo-run-image:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: Provider quality and compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3'
      - name: Install locked dependencies
        working-directory: company-check-provider
        run: bun install --frozen-lockfile
      - name: Format, type, lint, unit, contract, and production compilation
        working-directory: company-check-provider
        run: |
          bun run format:check
          bun run typecheck
          bun run lint
          bun run test
          bun run test:contract
          bun run build

  service:
    name: Service complete quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run unit, integration, contract, architecture, lint, coverage, and API gates
        working-directory: company-check-service
        run: ./gradlew qualityGate --dependency-verification=strict --no-parallel --max-workers=1

  images:
    name: Build and smoke-test ${{ matrix.variant }} image
    needs: [provider, service]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [jvm, native]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build and smoke-test immutable ${{ matrix.variant }} image
        working-directory: company-check-service
        env:
          PAKETO_BUILDER_IMAGE: ${{ inputs.paketo-builder-image }}
          PAKETO_RUN_IMAGE: ${{ inputs.paketo-run-image }}
        run: >-
          ./gradlew imageSmoke
          -PimageVariant=${{ matrix.variant }}
          -PnativeOptimization=b
          -PpaketoBuilderImage="$PAKETO_BUILDER_IMAGE"
          -PpaketoRunImage="$PAKETO_RUN_IMAGE"
          -PimagePlatform=linux/amd64
          -PimageName=company-check-validation:${{ matrix.variant }}-${{ github.sha }}
          --no-parallel --max-workers=1
      - name: Upload image reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.variant }}-${{ github.run_id }}
          path: company-check-service/build/reports/
          if-no-files-found: warn
