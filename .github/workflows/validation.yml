name: Complete validation

on:
  workflow_dispatch:
    inputs:
      paketo-builder-image:
        description: Immutable Paketo builder image reference
        required: true
        type: string
      paketo-run-image:
        description: Immutable Paketo run image reference
        required: true
        type: string
      image-variant:
        description: Image variant to validate
        required: true
        default: jvm
        type: choice
        options:
          - jvm
          - native
  workflow_call:
    inputs:
      paketo-builder-image:
        required: true
        type: string
      paketo-run-image:
        required: true
        type: string
      image-variant:
        required: false
        default: jvm
        type: string
      postgres-image:
        required: false
        default: ''
        type: string
      redis-image:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: workspace-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: Provider quality and compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        working-directory: company-check-provider
        run: bun install --frozen-lockfile
      - name: Format, type, lint, unit, contract, and production compilation
        working-directory: company-check-provider
        run: |
          bun run format:check
          bun run typecheck
          bun run lint
          bun run test
          bun run test:contract
          bun run build

  service:
    name: Service complete quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            25
            24
      - name: Configure Gradle Java toolchains
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${JAVA_HOME_25_X64},${JAVA_HOME_24_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run unit, integration, contract, architecture, lint, coverage, and API gates
        working-directory: company-check-service
        run: ./gradlew qualityGate --dependency-verification=strict --no-parallel --max-workers=1

  images:
    name: Build or reuse ${{ inputs.image-variant }} validation images
    uses: ./.github/workflows/build-images.yml
    with:
      paketo-builder-image: ${{ inputs.paketo-builder-image }}
      paketo-run-image: ${{ inputs.paketo-run-image }}
      image-variant: ${{ inputs.image-variant }}

  e2e:
    name: E2E and Locust against published image
    needs: [provider, service, images]
    if: inputs.postgres-image != '' && inputs.redis-image != ''
    uses: ./.github/workflows/e2e.yml
    with:
      service-image: ${{ needs.images.outputs.service-image }}
      provider-image: ${{ needs.images.outputs.provider-image }}
      postgres-image: ${{ inputs.postgres-image }}
      redis-image: ${{ inputs.redis-image }}
