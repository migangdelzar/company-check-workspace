name: Component quality

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: inputs.component == 'service'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: inputs.component == 'service'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: inputs.component == 'provider'
        with:
          bun-version: '1.3.14'

      - name: Check service
        if: inputs.component == 'service'
        working-directory: company-check-service
        run: ./gradlew check

      - name: Check provider
        if: inputs.component == 'provider'
        working-directory: company-check-provider
        run: |
          bun install --frozen-lockfile
          bun run quality
          bun run test:contract
