name: Compose API E2E
description: Start an immutable-image Compose stack and validate the verification API
inputs:
  service-image:
    description: Immutable service image reference
    required: true
  provider-image:
    description: Immutable provider image reference
    required: true
  postgres-image:
    description: Immutable PostgreSQL image reference
    required: true
  redis-image:
    description: Immutable Redis image reference
    required: true
runs:
  using: composite
  steps:
    - name: Start Compose dependencies and verify the verification API
      shell: bash
      env:
        COMPANY_CHECK_SERVICE_IMAGE: ${{ inputs.service-image }}
        COMPANY_CHECK_PROVIDER_IMAGE: ${{ inputs.provider-image }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        REDIS_IMAGE: ${{ inputs.redis-image }}
      run: |
        set -euo pipefail
        cleanup() {
          exit_code=$?
          if (( exit_code != 0 )); then
            docker compose ps --all >&2 || true
            docker compose logs --no-color --tail=200 backend free-provider premium-provider postgres >&2 || true
          fi
          docker compose down >/dev/null 2>&1 || true
          exit "$exit_code"
        }
        trap cleanup EXIT
        docker compose up -d
        timeout_seconds="${COMPOSE_WAIT_TIMEOUT_SECONDS:-120}"
        deadline=$((SECONDS + timeout_seconds))
        while (( SECONDS < deadline )); do
          status="$(docker compose ps --all --format '{{.Service}} {{.State}} {{.Health}}')"
          case "$status" in
            *" exited "*|*" dead "*) printf '%s\n' "$status" >&2; exit 1 ;;
          esac
          if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
            break
          fi
        done
        if (( SECONDS >= deadline )); then
          docker compose ps --all
          curl --fail --show-error http://localhost:8080/actuator/health || true
          exit 1
        fi

        verification_id="$(uuidgen)"
        start_response="$(curl --fail --silent --show-error --get \
          --data-urlencode "verificationId=${verification_id}" \
          --data-urlencode "query=CJQUNXGW" \
          http://localhost:8080/backend-service)"
        printf '%s' "$start_response" | jq -e --arg id "$verification_id" '
          .verificationId == $id and
          .status == "COMPLETED" and
          .provider == "FREE" and
          .company.cin == "CJQUNXGW"
        ' >/dev/null

        verification_response="$(curl --fail --silent --show-error \
          "http://localhost:8080/verifications/${verification_id}")"
        printf '%s' "$verification_response" | jq -e --arg id "$verification_id" '
          .verificationId == $id and
          .status == "COMPLETED" and
          .company.cin == "CJQUNXGW"
        ' >/dev/null
