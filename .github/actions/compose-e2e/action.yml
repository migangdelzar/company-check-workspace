name: Compose E2E
description: Run workspace E2E against explicitly supplied immutable image digests
inputs:
  service-image:
    description: Immutable service image reference
    required: true
  provider-image:
    description: Immutable provider image reference
    required: true
  postgres-image:
    description: Immutable PostgreSQL image reference
    required: true
  redis-image:
    description: Immutable Redis image reference
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/checkout-workspace
    - name: Start and verify the Compose stack
      shell: bash
      env:
        COMPANY_CHECK_SERVICE_IMAGE: ${{ inputs.service-image }}
        COMPANY_CHECK_PROVIDER_IMAGE: ${{ inputs.provider-image }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        REDIS_IMAGE: ${{ inputs.redis-image }}
      run: |
        set -euo pipefail
        docker compose up -d
        cleanup() { docker compose down >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        timeout_seconds="${COMPOSE_WAIT_TIMEOUT_SECONDS:-120}"
        deadline=$((SECONDS + timeout_seconds))
        while (( SECONDS < deadline )); do
          status="$(docker compose ps --all --format '{{.Service}} {{.State}} {{.Health}}')"
          case "$status" in
            *" exited "*|*" dead "*) printf '%s\n' "$status" >&2; exit 1 ;;
          esac
          [[ "$status" == *"backend running healthy"* ]] && exit 0
        done
        docker compose ps --all
        exit 1
