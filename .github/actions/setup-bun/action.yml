name: Set up Bun and dependency cache
description: Install pinned Bun and cache the install cache plus provider node_modules
inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: '1.3.14'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Cache Bun install cache and provider dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          company-check-provider/node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('company-check-provider/bun.lock') }}