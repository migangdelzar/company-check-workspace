multitenancy_enabled: false
server: { http_listen_port: 9009 }
common:
  path_prefix: /data
  storage: { backend: filesystem }
  replication_factor: 1
blocks_storage: { backend: filesystem, filesystem: { dir: /data/blocks } }
compactor: { data_dir: /data/compactor }
limits:
  compactor_blocks_retention_period: 24h
  max_global_series_per_user: 5000
  max_global_metadata_per_user: 1000
