name: ${COMPOSE_PROJECT_NAME:-company-check}
services:
  backend:
    image: ${COMPANY_CHECK_SERVICE_IMAGE:-company-check-service:local}
    ports: ["${COMPANY_CHECK_SERVICE_PORT:-8080}:8080"]
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: ${BACKEND_MEMORY_LIMIT:-1536M}
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${COMPANY_CHECK_DB_NAME:-company_check}"
      SPRING_DATASOURCE_USERNAME: "${COMPANY_CHECK_DB_USER:-company_check}"
      SPRING_DATASOURCE_PASSWORD: "${COMPANY_CHECK_DB_PASSWORD:-change-me-locally}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-single-node}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-company-check-service}"
      OTEL_METRICS_EXPORTER: "${OTEL_METRICS_EXPORTER:-none}"
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-none}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-none}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      VERIFICATION_FREE_BASE_URL: http://free-provider:3000
      VERIFICATION_FREE_PATH: "/free-third-party?query={query}"
      VERIFICATION_PREMIUM_BASE_URL: http://premium-provider:3000
      VERIFICATION_PREMIUM_PATH: "/premium-third-party?query={query}"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      free-provider: { condition: service_healthy }
      premium-provider: { condition: service_healthy }
  backend-debug:
    extends:
      service: backend
    profiles: [debug]
    ports:
      - "${COMPANY_CHECK_DEBUG_PORT:-8081}:8080"
      - "${COMPANY_CHECK_JDWP_PORT:-5005}:5005"
    environment:
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-} -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:${COMPANY_CHECK_JDWP_TARGET_PORT:-5005}"
  free-provider:
    image: ${COMPANY_CHECK_PROVIDER_IMAGE:-company-check-provider:local}
    deploy:
      resources:
        limits:
          cpus: "${PROVIDER_CPU_LIMIT:-0.25}"
          memory: ${PROVIDER_MEMORY_LIMIT:-256M}
    environment:
      PROVIDER_TIER: free
      PROVIDER_SCENARIO_FILE: /app/config/scenarios/free.json
      PORT: "3000"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
  premium-provider:
    image: ${COMPANY_CHECK_PROVIDER_IMAGE:-company-check-provider:local}
    deploy:
      resources:
        limits:
          cpus: "${PROVIDER_CPU_LIMIT:-0.25}"
          memory: ${PROVIDER_MEMORY_LIMIT:-256M}
    environment:
      PROVIDER_TIER: premium
      PROVIDER_SCENARIO_FILE: /app/config/scenarios/premium.json
      PORT: "3000"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-0.50}"
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
    environment:
      POSTGRES_DB: ${COMPANY_CHECK_DB_NAME:-company_check}
      POSTGRES_USER: ${COMPANY_CHECK_DB_USER:-company_check}
      POSTGRES_PASSWORD: ${COMPANY_CHECK_DB_PASSWORD:-change-me-locally}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  locust:
    image: ${LOCUST_IMAGE:-locustio/locust:2.32.10}
    profiles: [performance]
    command: ["-f", "/mnt/performance/locustfile.py", "--host", "http://backend:8080"]
    volumes:
      - ./company-check-service/performance:/mnt/performance:ro
      - ${PERFORMANCE_ARTIFACTS_DIR:-.performance-artifacts}:/mnt/artifacts
    networks: [internal]
    depends_on: { backend: { condition: service_started } }
networks:
  internal:
    internal: ${COMPOSE_INTERNAL_NETWORK:-false}
