name: \${COMPOSE_PROJECT_NAME:-company-check}
services:
  backend:
    image: \${COMPANY_CHECK_SERVICE_IMAGE:?set COMPANY_CHECK_SERVICE_IMAGE}
    ports: ["\${COMPANY_CHECK_SERVICE_PORT:-8080}:8080"]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      free-provider: { condition: service_healthy }
      premium-provider: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
  free-provider:
    image: \${COMPANY_CHECK_PROVIDER_IMAGE:?set COMPANY_CHECK_PROVIDER_IMAGE}
    environment: { PROVIDER_TIER: free, PORT: "3000" }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
  premium-provider:
    image: \${COMPANY_CHECK_PROVIDER_IMAGE:?set COMPANY_CHECK_PROVIDER_IMAGE}
    environment: { PROVIDER_TIER: premium, PORT: "3000" }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: \${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: \${COMPANY_CHECK_DB_NAME:-company_check}
      POSTGRES_USER: \${COMPANY_CHECK_DB_USER:-company_check}
      POSTGRES_PASSWORD: \${COMPANY_CHECK_DB_PASSWORD:?set a local database password}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: \${REDIS_IMAGE:?set REDIS_IMAGE}
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  internal: { internal: true }
