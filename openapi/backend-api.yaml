openapi: 3.1.1
info:
  title: Company Check Backend API
  version: 1.0.0
  license: {name: Proprietary, url: https://www.incode.com/}
servers: [{url: /}]
security: []
paths:
  /backend-service:
    get:
      operationId: submitVerification
      parameters:
        - {$ref: '#/components/parameters/VerificationId'}
        - {$ref: '#/components/parameters/Query'}
      responses:
        '200': {description: Verification result, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationResponse'}}}}
        '400': {$ref: '#/components/responses/Problem400'}
        '409': {$ref: '#/components/responses/Problem409'}
        '502': {$ref: '#/components/responses/Problem502'}
        '503': {$ref: '#/components/responses/Problem503'}
  /verifications/{verificationId}:
    get:
      operationId: retrieveVerification
      parameters: [{$ref: '#/components/parameters/VerificationIdPath'}]
      responses:
        '200': {description: Stored verification, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationResponse'}}}}
        '404': {$ref: '#/components/responses/Problem404'}
components:
  parameters:
    VerificationId: {name: verificationId, in: query, required: true, schema: {type: string, format: uuid}}
    VerificationIdPath: {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
    Query: {name: query, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
  schemas:
    VerificationResponse:
      type: object
      required: [verificationId, query, status]
      properties:
        verificationId: {type: string, format: uuid}
        query: {type: string}
        status: {type: string, enum: [IN_PROGRESS, COMPLETED, FAILED]}
        normalizedQuery: {type: string}
        startedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        reason: {type: string, enum: [PROVIDERS_UNAVAILABLE, PROVIDER_CLIENT_ERROR, VERIFICATION_EXPIRED]}
        company: {$ref: '#/components/schemas/Company'}
        otherResults: {type: array, items: {$ref: '#/components/schemas/Company'}}
    Company:
      type: object
      required: [cin, name, registrationDate, address, isActive]
      properties:
        cin: {type: string}
        name: {type: string}
        registrationDate: {type: string, format: date}
        address: {type: string}
        isActive: {type: boolean}
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
  responses:
    Problem400: {description: Bad request, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Problem404: {description: Not found, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Problem409: {description: Conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Problem502: {description: Provider client error, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
    Problem503: {description: Providers unavailable, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
